name: VINIX7 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Front-End build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Back-End install & syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # npm install (bukan npm ci) karena back-end/package-lock.json belum tentu ada di repo
      - run: npm install --no-audit --no-fund
      - name: Cek sintaks semua file JS
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
