openapi: 3.1.0
info:
  title: VINIX7 Learning & Assessment Platform API
  version: 1.0.0
  description: |
    REST API resmi untuk Platform Pembelajaran & Penilaian Online Interaktif VINIX7.
    Mencakup autentikasi JWT, kurikulum 10 modul bertahap (Progressive Gating),
    rotasi paket soal dinamis (Set A, B, C, dan acak pada percobaan >= 4),
    validasi cooldown 60 detik, serta penilaian otomatis Pilihan Ganda & Essay di server.
servers:
  - url: http://localhost:5000/api
    description: Local Development Server

tags:
  - name: Auth
    description: Registrasi dan autentikasi peserta
  - name: Courses
    description: Daftar modul, materi pembelajaran, dan progres bagian
  - name: Exams & Attempts
    description: Pelaksanaan ujian akhir modul, penilaian server-side, dan pembahasan hasil
  - name: Progress
    description: Ringkasan capaian belajar peserta

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: BAD_REQUEST
        message:
          type: string
          example: Terjadi kesalahan pada permintaan.

    CooldownErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: COOLDOWN_ACTIVE
        message:
          type: string
          example: Mohon tunggu jeda waktu cooldown selama 60 detik sebelum mengulang ujian.
        remainingSeconds:
          type: integer
          example: 60
        cooldownUntil:
          type: string
          format: date-time
          example: 2026-11-19T06:49:47.813Z

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nama:
          type: string
          example: Kevin Nathanael
        email:
          type: string
          format: email
          example: kevin@vinix7.com
        avatar:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
        user:
          $ref: '#/components/schemas/UserProfile'

    CourseSummary:
      type: object
      properties:
        id:
          type: string
          example: c0000001-0000-0000-0000-000000000001
        urutan:
          type: integer
          example: 1
        judul:
          type: string
          example: Mindset Startup & Problem Solving
        ringkasan:
          type: string
        kategori:
          type: string
        estimasi_waktu:
          type: string
        estimasiWaktu:
          type: string
        level:
          type: string
        icon:
          type: string
        pdf_url:
          type: string
          nullable: true
        pdfUrl:
          type: string
          nullable: true
        status:
          type: string
          enum: [locked, unlocked, passed]
        bagian_selesai:
          type: array
          items:
            type: integer
        bagianSelesai:
          type: array
          items:
            type: integer
        nilai_terbaik:
          type: number
        nilaiTerbaik:
          type: number
        total_sections:
          type: integer
        totalSections:
          type: integer
        is_completed:
          type: boolean
        isCompleted:
          type: boolean

    SectionItem:
      type: object
      properties:
        id:
          type: string
        urutan:
          type: integer
        judul:
          type: string
        isi:
          type: string
        pdf_url:
          type: string
          nullable: true
        pdfUrl:
          type: string
          nullable: true
        pdf_title:
          type: string
          nullable: true
        pdfTitle:
          type: string
          nullable: true

    ExamQuestionClient:
      type: object
      description: Payload soal ujian tanpa informasi kunci jawaban atau poin.
      properties:
        id:
          type: string
        urutan:
          type: integer
        topik:
          type: string
        tipe:
          type: string
          enum: [pilihan_ganda, essay]
        teks:
          type: string
        options:
          type: array
          nullable: true
          items:
            type: object
            properties:
              id:
                type: string
              teks:
                type: string

    EvaluatedQuestion:
      type: object
      properties:
        questionId:
          type: string
        urutan:
          type: integer
        topik:
          type: string
        tipe:
          type: string
          enum: [pilihan_ganda, essay]
        teks:
          type: string
        options:
          type: array
          nullable: true
          items:
            type: object
            properties:
              id:
                type: string
              teks:
                type: string
        jawabanPengguna:
          type: string
        kunciJawaban:
          type: string
        poin:
          type: number
          description: "PG: 10 atau 0. Essay: 10, 9, 8, 7, atau 0."
        label:
          type: string
          enum: [Tepat, Kurang Tepat, Salah]
        pembahasan:
          type: string

    ExamResultResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        id:
          type: string
          format: uuid
        attemptId:
          type: string
          format: uuid
        courseId:
          type: string
        attemptNumber:
          type: integer
        setPaket:
          type: string
          enum: [A, B, C]
        nilai:
          type: number
          example: 86.7
        finalScore:
          type: number
          example: 86.7
        totalScore:
          type: number
          example: 86.7
        lulus:
          type: boolean
          example: true
        isPassed:
          type: boolean
          example: true
        totalPG:
          type: number
          example: 90
        totalEssay:
          type: number
          example: 40
        weakTopics:
          type: array
          items:
            type: string
        cooldownUntil:
          type: string
          format: date-time
          nullable: true
        evaluatedQuestions:
          type: array
          items:
            $ref: '#/components/schemas/EvaluatedQuestion'

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Registrasi akun peserta baru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nama, email, password]
              properties:
                nama:
                  type: string
                  example: Kevin Nathanael
                email:
                  type: string
                  format: email
                  example: kevin@vinix7.com
                password:
                  type: string
                  minLength: 6
                  example: Password123!
      responses:
        '201':
          description: Akun berhasil dibuat dan progress 10 modul diinisialisasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validasi input gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email sudah terdaftar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Autentikasi peserta dan penerbitan token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: kevin@vinix7.com
                password:
                  type: string
                  example: Password123!
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Kredensial tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /courses:
    get:
      tags: [Courses]
      summary: Mengambil daftar seluruh 10 modul beserta status progressive gating
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daftar modul berhasil diambil
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseSummary'

  /courses/{id}:
    get:
      tags: [Courses]
      summary: Mengambil detail modul dan konten bagian materi (sections)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: UUID modul atau alias urutan (misal 1, c1, modul-1)
      responses:
        '200':
          description: Detail modul berhasil diambil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CourseSummary'
                  - type: object
                    properties:
                      sections:
                        type: array
                        items:
                          $ref: '#/components/schemas/SectionItem'
        '403':
          description: Modul masih terkunci (COURSE_LOCKED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Modul tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /courses/{id}/sections/{sid}/complete:
    post:
      tags: [Courses]
      summary: Menandai bagian materi (section) telah selesai dibaca
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: sid
          in: path
          required: true
          schema:
            type: integer
          description: Nomor urutan bagian materi (1, 2, atau 3)
      responses:
        '200':
          description: Bagian materi berhasil ditandai selesai
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  bagianSelesai:
                    type: array
                    items:
                      type: integer
                  bagian_selesai:
                    type: array
                    items:
                      type: integer
        '403':
          description: Modul masih terkunci
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /courses/{id}/exam/start:
    post:
      tags: [Exams & Attempts]
      summary: Memulai sesi ujian akhir modul (validasi cooldown & rotasi Set A/B/C)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sesi ujian dimulai (10 PG + 5 Essay tanpa kunci jawaban)
          content:
            application/json:
              schema:
                type: object
                properties:
                  attemptId:
                    type: string
                    format: uuid
                  courseId:
                    type: string
                  attemptNumber:
                    type: integer
                  setPaket:
                    type: string
                    enum: [A, B, C]
                  questions:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExamQuestionClient'
        '403':
          description: Modul masih terkunci
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Masa tunggu cooldown 60 detik masih aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CooldownErrorResponse'

  /attempts/{id}/submit:
    post:
      tags: [Exams & Attempts]
      summary: Mengirim seluruh jawaban ujian untuk dinilai otomatis di server
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answers:
                  type: object
                  additionalProperties:
                    type: string
                  example:
                    q1000001-0000-0000-0000-000000000001: o1-A1-3
                    q1000002-0000-0000-0000-000000000001: Who, Context, Root Cause, dan The Gap.
      responses:
        '200':
          description: Penilaian selesai, status kelulusan & progressive gating diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamResultResponse'
        '400':
          description: Ujian sudah pernah disubmit sebelumnya
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Sesi ujian tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /attempts/{id}/result:
    get:
      tags: [Exams & Attempts]
      summary: Mengambil skor akhir, analisis topik lemah, kunci jawaban, dan pembahasan
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detail hasil evaluasi ujian
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamResultResponse'
        '403':
          description: Akses ditolak (bukan pemilik attempt)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Hasil ujian tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me/progress:
    get:
      tags: [Progress]
      summary: Mengambil ringkasan progres belajar peserta di seluruh 10 modul
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ringkasan progres belajar berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCourses:
                    type: integer
                    example: 10
                  passedCount:
                    type: integer
                    example: 1
                  percentage:
                    type: integer
                    example: 10
                  averageScore:
                    type: number
                    example: 100
                  totalAttempts:
                    type: integer
                    example: 2
                  progressMap:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        status:
                          type: string
                          enum: [locked, unlocked, passed]
                        bagianSelesai:
                          type: array
                          items:
                            type: integer
                        bagian_selesai:
                          type: array
                          items:
                            type: integer
                        nilaiTerbaik:
                          type: number
                        nilai_terbaik:
                          type: number